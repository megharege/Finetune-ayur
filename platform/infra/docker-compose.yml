version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ayur_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ayur_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayur_password_secure}
      POSTGRES_DB: ${POSTGRES_DB:-ayur_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ayur_redis
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: ayur_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_master_key_secure_123}
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  neo4j:
    image: neo4j:5-community
    container_name: ayur_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_password_secure}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  minio:
    image: minio/minio:RELEASE.2024-01-31T03-12-30Z
    container_name: ayur_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password_secure}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  meili_data:
  neo4j_data:
  minio_data:
