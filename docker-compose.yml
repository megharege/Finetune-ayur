version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./ayur_hospital.db
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=ayurveda-dev-key
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=ayurveda123
    depends_on:
      - meilisearch

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  meilisearch:
    image: getmeili/meilisearch:v1.6
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=ayurveda-dev-key
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data

  neo4j:
    image: neo4j:5.18-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/ayurveda123
    volumes:
      - neo4j_data:/data

volumes:
  meili_data:
  neo4j_data:
